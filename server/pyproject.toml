[project]
name = "debt-collector-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.8",
    "email-validator>=2.1",
    "orjson>=3.10",
    "argon2-cffi>=23.1",
    "apscheduler>=3.10",
    "structlog>=24.4",
    "resend>=2.5",
    "aiobotocore>=2.15",
    "weasyprint>=63.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "httpx>=0.28",
    "websockets>=13.1",
    "tzdata",
    "aiosmtplib>=5.1.0",
    "slowapi>=0.1.9",
    "redis>=7.4.0",
    "cryptography>=44.0",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "faker>=40.13.0",
    "testcontainers[postgres]>=4.14.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"routers/*" = ["B008"]
"dependencies/*" = ["B008"]
"alembic/versions/*" = ["E501"]
"seeds/kinks.py" = ["E501"]

[tool.pyright]
include = ["."]
exclude = ["**/__pycache__", ".venv", "alembic"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnusedFunction = false
reportAssignmentType = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

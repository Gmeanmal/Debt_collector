<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var saved = localStorage.getItem("theme") || "system";
        var isDark =
          saved === "dark" ||
          (saved === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (!isDark) document.documentElement.setAttribute("data-theme", "light");
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debt Collector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
